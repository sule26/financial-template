# Local stack. Port published on loopback only (docs/13-seguranca.md).
services:
  app:
    build: .
    image: expense-tracker:local
    user: "${UIDGID:-1000:1000}"
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    environment:
      TZ: America/Sao_Paulo
      LOG_LEVEL: INFO
      SCAN_INTERVAL_SECONDS: "60"
    volumes:
      - ./data:/app/data
      - ./inbox:/app/inbox  # writable: the app creates one folder per card/account
      - ./profiles:/app/profiles
      - ./secrets/pdf-passwords.yaml:/run/secrets/pdf-passwords.yaml:ro
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped

  backend-dev:
    profiles: [dev]
    image: expense-tracker-backend-dev
    user: "${UIDGID:-1000:1000}"
    working_dir: /src/backend
    command: >-
      uvicorn expense_tracker.api.devserver:app --host 0.0.0.0 --port 8000 --reload
      --reload-dir /src/backend/src
    environment:
      HOME: /tmp
      TZ: America/Sao_Paulo
      DATA_DIR: /src/data
      INBOX_DIR: /src/inbox
      PROFILES_DIR: /src/profiles
      SECRETS_FILE: /src/secrets/pdf-passwords.yaml
      ALLOWED_HOSTS: "backend-dev"
    volumes:
      - .:/src
    ports:
      - "127.0.0.1:8000:8000"

  frontend-dev:
    profiles: [dev]
    image: node:20.18.1-slim@sha256:b2c8e0eb8a6aeeae33b2711f8f516003e27ee45804e270468d937b3214f2f0cc
    user: "${UIDGID:-1000:1000}"
    working_dir: /src/frontend
    command: npx vite --host 0.0.0.0
    environment:
      HOME: /tmp
      API_TARGET: http://backend-dev:8000
    volumes:
      - .:/src
    ports:
      - "127.0.0.1:5173:5173"

# Fixed subnet outside the 172.16/12 range: corporate VPNs often route 172.x subnets, which
# makes the published port hang (packets to the container go into the VPN tunnel).
networks:
  default:
    ipam:
      config:
        - subnet: 192.168.240.0/24
